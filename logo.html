<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">
<title>BLACKAI | Be Safe Always</title>
<link rel="icon" type="image/svg+xml" href="blackai-logo.svg">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#05070d;color:#fff}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;position:relative;padding:24px}
body:before,body:after{content:"";position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(85px);opacity:.22;pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
body:before{background:#006dff;top:-28vmax;left:-18vmax}
body:after{background:#e51b36;right:-28vmax;bottom:-30vmax;animation-delay:-4s}
.scene{position:relative;z-index:1;width:min(100%,520px);text-align:center;padding:34px 22px 30px;border:1px solid #24446c;border-radius:30px;background:linear-gradient(155deg,#101d30dd,#080b13f2 65%);box-shadow:0 0 55px #087bff24,inset 0 0 35px #1b5da51c;animation:rise 1s ease both}
.logo-wrap{width:min(68vw,300px);aspect-ratio:1;margin:0 auto 14px;display:grid;place-items:center;position:relative;animation:float 4s ease-in-out infinite}
.logo-wrap:before{content:"";position:absolute;inset:7%;border-radius:50%;border:1px solid #2f9aff70;box-shadow:0 0 25px #168cff80,inset 0 0 25px #168cff40;animation:pulse 2.8s ease-in-out infinite}
.logo-wrap:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#52b7ff;border-right-color:#ed3049;animation:spin 5s linear infinite}
.logo{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 0 17px #168cffaa);animation:glow 3s ease-in-out infinite alternate}
h1{font-size:clamp(38px,10vw,64px);line-height:1;margin:4px 0 12px;font-style:italic;font-weight:950;letter-spacing:2px;text-shadow:0 0 18px #167dff66}
h1 span{color:#ed3049}
.tag{font-size:clamp(13px,3.5vw,17px);letter-spacing:2.5px;color:#cbd9ed;font-weight:700}
.rule{width:120px;height:4px;margin:22px auto;border-radius:9px;background:linear-gradient(90deg,#167dff,#fff,#ed3049);box-shadow:0 0 15px #168cff88}
.caption{color:#aab8cb;font-size:14px;letter-spacing:1px}
.back{display:inline-block;margin-top:25px;color:#d9eaff;text-decoration:none;border:1px solid #34577f;border-radius:30px;padding:11px 20px;background:#10223a;transition:.25s}
.back:hover{background:#173b64;box-shadow:0 0 20px #168cff55;transform:translateY(-2px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.55}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes glow{to{filter:drop-shadow(0 0 28px #168cffdd) drop-shadow(0 0 8px #ed304988)}}
@keyframes drift{to{transform:translate(9vw,7vh) scale(1.18)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene">
  <div class="logo-wrap"><img class="logo" src="blackai-logo.svg" alt="BLACKAI eagle shield logo"></div>
  <h1>BLACK<span>AI</span></h1>
  <div class="tag">PERSONAL SAFETY • SMART PROTECTION</div>
  <div class="rule"></div>
  <div class="caption">आपकी सुरक्षा, हमारी प्राथमिकता</div>
  <a class="back" href="index.html">← BLACKAI ऐप पर वापस जाएँ</a>
</main>
</body>
</html>
