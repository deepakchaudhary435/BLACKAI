name: Build BLACKAI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-sensor-app/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "0.1.${{ github.run_number }}"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-sensor-app
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: BLACKAI-debug-apk
          path: android-sensor-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
