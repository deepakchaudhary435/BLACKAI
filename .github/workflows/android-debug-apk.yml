name: Build BLACKAI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-sensor-app/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "0.1.${{ github.run_number }}"
      BLACKAI_KEYSTORE_PASSWORD: ${{ secrets.BLACKAI_KEYSTORE_PASSWORD }}
      BLACKAI_KEY_ALIAS: ${{ secrets.BLACKAI_KEY_ALIAS }}
      BLACKAI_KEY_PASSWORD: ${{ secrets.BLACKAI_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Decode permanent signing key
        env:
          BLACKAI_KEYSTORE_BASE64: ${{ secrets.BLACKAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$BLACKAI_KEYSTORE_BASE64" || (echo "Missing BLACKAI_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$BLACKAI_KEYSTORE_PASSWORD" || (echo "Missing BLACKAI_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$BLACKAI_KEY_ALIAS" || (echo "Missing BLACKAI_KEY_ALIAS repository secret" && exit 1)
          test -n "$BLACKAI_KEY_PASSWORD" || (echo "Missing BLACKAI_KEY_PASSWORD repository secret" && exit 1)
          echo "$BLACKAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blackai-release.jks"
          echo "BLACKAI_KEYSTORE_FILE=$RUNNER_TEMP/blackai-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android-sensor-app
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: BLACKAI-release-apk
          path: android-sensor-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
